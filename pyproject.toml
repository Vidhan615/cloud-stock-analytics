[project]
name = "cloud-stock-analytics"
version = "1.0.0"
description = "A three-tier stock analytics and portfolio application with AWS infrastructure"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
